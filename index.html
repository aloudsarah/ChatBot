<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الصوتي</title>

  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-color: #07080C;
      --card-bg: rgba(18, 20, 29, 0.85);
      --text-color: #E2E8F0;
      --btn-bg: rgba(255, 255, 255, 0.06);
      --btn-border: rgba(255, 255, 255, 0.12);

      --orb-idle: radial-gradient(circle at 35% 35%, #8A2BE2, #4B0082 65%, #050508 100%);
      --orb-listening: radial-gradient(circle at 35% 35%, #FF007F, #99004C 65%, #050508 100%);
      --orb-thinking: radial-gradient(circle at 35% 35%, #00F0FF, #008B8B 65%, #050508 100%);
      --orb-speaking: radial-gradient(circle at 35% 35%, #A855F7, #6B21A8 65%, #050508 100%);

      --glow-idle: rgba(138, 43, 226, 0.35);
      --glow-listening: rgba(255, 0, 127, 0.55);
      --glow-thinking: rgba(0, 240, 255, 0.55);
      --glow-speaking: rgba(168, 85, 247, 0.5);

      --user-bubble-bg: rgba(255, 0, 127, 0.15);
      --user-bubble-border: rgba(255, 0, 127, 0.25);
      --user-bubble-text: #FFB3D9;
    }

    :root[data-theme="light"] {
      --bg-color: #F0F3F9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-color: #1E293B;
      --btn-bg: rgba(0, 0, 0, 0.05);
      --btn-border: rgba(0, 0, 0, 0.08);

      --orb-idle: radial-gradient(circle at 35% 35%, #A78BFA, #6D28D9 65%, #311075 100%);
      --orb-listening: radial-gradient(circle at 35% 35%, #FB7185, #E11D48 65%, #580820 100%);
      --orb-thinking: radial-gradient(circle at 35% 35%, #38BDF8, #0284C7 65%, #032A42 100%);
      --orb-speaking: radial-gradient(circle at 35% 35%, #C084FC, #9333EA 65%, #3B0A66 100%);

      --glow-idle: rgba(124, 58, 237, 0.25);
      --glow-listening: rgba(225, 29, 72, 0.35);
      --glow-thinking: rgba(2, 132, 199, 0.35);
      --glow-speaking: rgba(147, 51, 234, 0.3);

      --user-bubble-bg: rgba(225, 29, 72, 0.1);
      --user-bubble-border: rgba(225, 29, 72, 0.2);
      --user-bubble-text: #9F1239;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Alexandria', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 90vh;
      max-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 10;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    .theme-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .circle-section {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .circle-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glow-aura {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: var(--glow-idle);
      filter: blur(35px);
      transition: all 0.6s ease;
      opacity: 0.8;
    }

    .smart-circle {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: var(--orb-idle);
      box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.5),
        inset 10px 10px 20px rgba(255, 255, 255, 0.25);
      cursor: pointer;
      z-index: 2;
      transition: all 0.5s ease;
      animation: floatCircle 4s ease-in-out infinite;
    }

    .container.chat-open .circle-section {
      flex: 0 0 auto;
      padding-top: 10px;
      margin-bottom: 12px;
    }

    .container.chat-open .circle-wrapper {
      width: 80px;
      height: 80px;
    }

    .container.chat-open .smart-circle {
      width: 60px;
      height: 60px;
    }

    .container.chat-open .glow-aura {
      filter: blur(20px);
    }

    @keyframes floatCircle {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    [data-state="listening"] .smart-circle {
      background: var(--orb-listening);
      animation: pulseListening 1.2s ease-in-out infinite alternate;
    }

    [data-state="listening"] .glow-aura {
      background: var(--glow-listening);
      filter: blur(45px);
    }

    @keyframes pulseListening {
      0% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1.22);
      }
    }

    [data-state="thinking"] .smart-circle {
      background: var(--orb-thinking);
      animation: rotateThinking 1.5s linear infinite;
    }

    [data-state="thinking"] .glow-aura {
      background: var(--glow-thinking);
      filter: blur(50px);
    }

    @keyframes rotateThinking {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    [data-state="speaking"] .smart-circle {
      background: var(--orb-speaking);
      animation: speakWave 0.8s infinite alternate ease-in-out;
    }

    [data-state="speaking"] .glow-aura {
      background: var(--glow-speaking);
      filter: blur(40px);
    }

    @keyframes speakWave {
      0% {
        transform: scale(1) rotate(-5deg);
      }

      100% {
        transform: scale(1.18) rotate(5deg);
      }
    }

    .chat-panel {
      width: 100%;
      flex: 0;
      height: 0;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--btn-border);
      border-radius: 20px;
      padding: 0 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .container.chat-open .chat-panel {
      flex: 1;
      height: auto;
      padding: 16px;
      opacity: 1;
      visibility: visible;
      margin-bottom: 16px;
    }

    .chat-panel::-webkit-scrollbar {
      width: 4px;
    }

    .chat-panel::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    .bubble.user {
      align-self: flex-start;
      background: var(--user-bubble-bg);
      border: 1px solid var(--user-bubble-border);
      color: var(--user-bubble-text);
      border-top-right-radius: 4px;
      font-weight: 500;
    }

    .bubble.assistant {
      align-self: flex-end;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-color);
      border-top-left-radius: 4px;
    }

    .text-toggle-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .text-toggle-btn:hover {
      transform: translateY(-2px);
    }

    .text-toggle-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>

<body data-state="idle">

  <div class="container" id="app">


    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="تغيير المود">
      <svg id="sunIcon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg id="moonIcon" viewBox="0 0 24 24" style="display:none;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>


    <div class="circle-section">
      <div class="circle-wrapper">
        <div class="glow-aura"></div>
        <div class="smart-circle" id="smartCircle" aria-label="الدائرة التفاعلية"></div>
      </div>
    </div>


    <div class="chat-panel" id="chatPanel"></div>


    <button class="text-toggle-btn" id="toggleTextBtn">
      <svg viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span id="btnLabel">إظهار النص</span>
    </button>

  </div>

  <script>
    document.documentElement.setAttribute('data-theme', 'dark');

    const app = document.getElementById('app');
    const toggleTextBtn = document.getElementById('toggleTextBtn');
    const chatPanel = document.getElementById('chatPanel');
    const btnLabel = document.getElementById('btnLabel');

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    const ws = new WebSocket(`ws://${window.location.host}/ws`);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      sunIcon.style.display = newTheme === 'light' ? 'none' : 'block';
      moonIcon.style.display = newTheme === 'light' ? 'block' : 'none';
    });

    toggleTextBtn.addEventListener('click', () => {
      const isOpen = app.classList.toggle('chat-open');
      btnLabel.textContent = isOpen ? "إخفاء النص" : "إظهار النص";
      if (isOpen) {
        chatPanel.scrollTop = chatPanel.scrollHeight;
      }
    });

    function setStatus(state) {
      document.body.dataset.state = state;
    }

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `bubble ${role}`;
      msg.textContent = text;
      chatPanel.appendChild(msg);
      chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.state) {
        setStatus(data.state);
      }
      if (data.user_text) {
        addMessage('user', data.user_text);
      }
      if (data.assistant_text) {
        addMessage('assistant', data.assistant_text);
      }
    };
  </script>

</body>

</html>
